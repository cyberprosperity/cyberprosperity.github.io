<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Cyber Prosperity</title>

    <link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="login-page">

<section class="login">

    <div class="login-container">

        <div class="login-box">

            <h1>Create Account</h1>

            <p>Bergabung bersama komunitas Cyber Prosperity.</p>

            <form>

    <input
        type="text"
        name="full_name"
        placeholder="Full Name"
        required>

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <input
        type="tel"
        id="register-phone"
        name="phone"
        placeholder="+62 8123456789"
        inputmode="tel"
        pattern="^\+62[0-9]{8,13}$"
        title="Gunakan format +62 diikuti nomor Anda, contoh: +628123456789"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required>

    <button class="btn-primary">
        Create Account
    </button>
    
<div class="login-divider">
    <span>OR</span>
</div>

<button type="button" class="btn-google">
    <img src="assets/images/icons/google.png" alt="Google">
    Sign up with Google
</button>

<p class="login-link">
    Already have an account?
    <a href="login.html">Login</a>
</p>
            </form>

        </div>

    </div>
</section>

<script>
    // ==========================================
    // AUTO-FORMAT NOMOR TELEPON KE +62
    // - Diketik "08123456789"  -> otomatis jadi "+628123456789"
    // - Diketik "8123456789"   -> otomatis jadi "+628123456789"
    // - Diketik "62812..."     -> otomatis jadi "+62812..."
    // - Sudah diawali "+62"    -> dibiarkan apa adanya
    // ==========================================
    (function () {
        const phoneInput = document.getElementById("register-phone");
        if (!phoneInput) return;

        phoneInput.addEventListener("input", function () {
            let value = this.value;

            // buang semua karakter selain angka dan tanda +
            value = value.replace(/[^\d+]/g, "");

            if (value.startsWith("+62")) {
                // sudah benar, tidak diapa-apakan
            } else if (value.startsWith("62")) {
                value = "+" + value;
            } else if (value.startsWith("0")) {
                value = "+62" + value.slice(1);
            } else if (value.startsWith("+")) {
                // ada + tapi bukan +62 (misal orang ketik +1...), biarkan user yang perbaiki
            } else if (value.length > 0) {
                value = "+62" + value;
            }

            this.value = value;
        });
    })();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/register.js"></script>

</body>

</html>
